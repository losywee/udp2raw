# This workflow is for a CMake project with cross-platform support for x86_64 and ARM64.
name: CMake with Cross-Platform Build Debian11

on:
  push:
    branches: [ "fake-http" ]
    tags: [ "v*" ]  # Trigger release on tags starting with 'v' (e.g., v1.0.0)
  pull_request:
    branches: [ "fake-http" ]

env:
  BUILD_TYPE: Release
  WORK_DIR: "${{ github.workspace }}/udp2raw"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    strategy:
      matrix:
        arch:
          - { name: "x86_64", target: "x86_64-linux-gnu", toolchain: "", extra_cmake_args: "" }
          - { name: "arm64", target: "aarch64-linux-gnu", toolchain: "aarch64-linux-gnu", extra_cmake_args: "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/udp2raw/toolchain-aarch64.cmake" }

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: udp2raw  # Ensure code is checked out to a predictable path

    - name: Create Working Directories
      run: |
        mkdir -p "${{ env.WORK_DIR }}"
        echo "Created working directory: ${{ env.WORK_DIR }}"

    - name: Debug Directory Structure After Checkout
      run: |
        echo "Current working directory: $(pwd)"
        ls -la
        echo "Listing contents of ${{ github.workspace }}:"
        ls -la "${{ github.workspace }}" || echo "Workspace directory not found"
        echo "Listing contents of ${{ github.workspace }}/udp2raw:"
        ls -la "${{ github.workspace }}/udp2raw" || echo "Source directory not found"
        echo "Checking for CMakeLists.txt in ${{ github.workspace }}/udp2raw:"
        ls -l "${{ github.workspace }}/udp2raw/CMakeLists.txt" || echo "CMakeLists.txt not found"

    - name: Install Build Essentials and Cross-Compilation Tools
      run: |
        apt-get update
        apt-get install -y build-essential make gcc g++ cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Debug Toolchain and Build Tools Availability
      run: |
        echo "Checking for build tools and compilers:"
        which make || echo "make not found"
        make --version || echo "make version check failed"
        which gcc || echo "gcc not found"
        which g++ || echo "g++ not found"
        which cmake || echo "cmake not found"
        cmake --version || echo "cmake version check failed"
        which aarch64-linux-gnu-gcc || echo "aarch64-linux-gnu-gcc not found"
        which aarch64-linux-gnu-g++ || echo "aarch64-linux-gnu-g++ not found"
        aarch64-linux-gnu-gcc --version || echo "aarch64-linux-gnu-gcc version check failed"
        aarch64-linux-gnu-g++ --version || echo "aarch64-linux-gnu-g++ version check failed"

    - name: Create Toolchain File for ARM64
      if: matrix.arch.name == 'arm64'
      run: |
        cat > "${{ env.WORK_DIR }}/toolchain-aarch64.cmake" << EOF
        set(CMAKE_SYSTEM_NAME Linux)
        set(CMAKE_SYSTEM_PROCESSOR aarch64)
        set(CMAKE_C_COMPILER /usr/bin/aarch64-linux-gnu-gcc)
        set(CMAKE_CXX_COMPILER /usr/bin/aarch64-linux-gnu-g++)
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        EOF
        echo "Toolchain file created at:"
        ls -l "${{ env.WORK_DIR }}/toolchain-aarch64.cmake"

    - name: Configure CMake
      run: |
        mkdir -p "${{ env.WORK_DIR }}/build-${{matrix.arch.name}}"
        # Explicitly specify the source directory (-S) where CMakeLists.txt is located
        cmake -S "${{ github.workspace }}/udp2raw" \
              -B "${{ env.WORK_DIR }}/build-${{matrix.arch.name}}" \
              -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
              -G "Unix Makefiles" \
              ${{matrix.arch.extra_cmake_args}} || { echo "CMake configuration failed for ${{matrix.arch.name}}"; exit 1; }

    - name: Build
      run: cmake --build "${{ env.WORK_DIR }}/build-${{matrix.arch.name}}" --config ${{env.BUILD_TYPE}}

    - name: Debug Build Directory
      run: |
        echo "Checking build directory for ${{matrix.arch.name}}:"
        ls -la "${{ env.WORK_DIR }}/build-${{matrix.arch.name}}" || echo "Build directory not found"

    # 后续步骤保持不变，省略以节省空间
    # ... (Test, Package Build Artifacts, Upload Build Artifacts, Debug Uploaded Artifacts)
